<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios · Consciencia VIBA</title>
    <link rel="stylesheet" href="css/styles.css?v=20261106paso7">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js?v=20261106paso7"></script>
    <script>
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.replace('login.html');
        })();
    </script>
</head>
<body data-pagina="formularios">
    <header id="app-header"></header>
    <main class="container una-columna">
        <section class="card">
            <h2>Nuevo diligenciamiento</h2>
            <p class="lead">Elija el programa y la persona. Cada envío queda guardado: una segunda respuesta no borra la primera.</p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="programa">Programa *</label>
                    <select id="programa"></select>
                </div>
                <div class="form-group">
                    <label for="taller">Taller, si aplica</label>
                    <select id="taller"></select>
                </div>
                <div class="form-group">
                    <label for="fecha_diligenciamiento">Fecha de diligenciamiento *</label>
                    <input type="date" id="fecha_diligenciamiento">
                </div>
                <div class="form-group">
                    <label for="persona">Persona beneficiaria *</label>
                    <select id="persona"></select>
                </div>
                <div class="form-group">
                    <label for="diligencia_es_beneficiaria">¿Quién diligencia es la persona beneficiaria? *</label>
                    <select id="diligencia_es_beneficiaria"></select>
                </div>
                <div class="form-group full oculto" id="fila-diligencia">
                    <label for="persona_diligencia">Persona que diligencia *</label>
                    <select id="persona_diligencia"></select>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Pregunta</h2>
            <p id="progreso-texto" class="lead"></p>
            <div class="progreso" aria-hidden="true"><span id="progreso-barra"></span></div>
            <div class="form-group">
                <label for="pregunta-select">Pregunta disponible</label>
                <select id="pregunta-select"></select>
            </div>
            <div id="control-pregunta"></div>
            <div class="btn-group">
                <button type="button" class="btn-primary" id="btn-guardar-respuesta">Guardar respuesta</button>
            </div>
            <p id="form-aviso" class="aviso" role="status"></p>
        </section>

        <section class="card">
            <h2>Respuestas de este diligenciamiento</h2>
            <ul id="lista-respuestas" class="lista-respuestas"></ul>
            <div class="btn-group">
                <button type="button" class="btn-primary" id="btn-guardar-diligenciamiento">Guardar diligenciamiento</button>
                <button type="button" class="btn-secondary" id="btn-limpiar">Limpiar respuestas</button>
            </div>
        </section>

        <section class="card">
            <h2>Diligenciamientos guardados</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Programa</th>
                            <th>Taller</th>
                            <th>Persona</th>
                            <th>Respuestas</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="historial-body">
                        <tr><td colspan="6">Cargando…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/catalogos.js?v=20261106paso7"></script>
    <script src="js/preguntas-formulario.js?v=20261106paso7"></script>
    <script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/formularios.js?v=20261106paso7"></script>
</body>
</html>
