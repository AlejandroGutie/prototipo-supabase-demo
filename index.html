<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo - Gestión de Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Carga del SDK de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Prototipo Web Supabase</h1>
        <nav>
            <a href="index.html" class="active">Clientes</a>
            <a href="proyectos.html">Proyectos</a>
        </nav>
    </header>

    <main class="container">
        <!-- SECCIÓN FORMULARIO -->
        <section class="card">
            <h2 id="form-title">Registrar Nuevo Cliente</h2>
            <form id="cliente-form">
                <input type="hidden" id="cliente-id">
                
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Maria Perez">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" placeholder="+57 300 000 0000">
                </div>

                <div class="form-group">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" placeholder="Nombre de la empresa">
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="Prospecto">Prospecto</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary" id="btn-guardar">Guardar Cliente</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar" style="display:none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- SECCIÓN TABLA Y BÚSQUEDA -->
        <section class="card">
            <h2>Directorio de Clientes</h2>
            <div class="form-group">
                <input type="text" id="search-input" placeholder="🔍 Buscar cliente por nombre o email...">
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Empresa</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clientes-tbody">
                        <tr><td colspan="5">Cargando datos desde Supabase...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/supabaseClient.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
