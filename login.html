<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container card">
        <h2 style="text-align: center; margin-bottom: 18px;">Consciencia VIBA</h2>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Ingresar</button>
        </form>

        <div id="auth-message" style="margin-top: 15px; font-size: 0.9rem; text-align: center;"></div>
    </div>

    <script src="js/supabaseClient.js?v=20261106formsql"></script>
    <script src="js/auth.js"></script>
</body>
</html>
