<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo - Gestión de Proyectos</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <!-- Bloqueo inmediato antes de renderizar el HTML -->
    <script>
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
            }
        })();
    </script>
</head>
<body>
    <header>
        <h1>Proyectos Consciencia VIBA</h1>
        <nav>
            <a href="index.html">Personas</a>
            <a href="proyectos.html" class="active">Proyectos</a>
        </nav>
    </header>

    <main class="container">
        <!-- FORMULARIO PROYECTOS -->
        <section class="card">
            <h2 id="proyecto-form-title">Nuevo Proyecto</h2>
            <form id="proyecto-form">
                <input type="hidden" id="proyecto-id">
                
                <div class="form-group">
                    <label for="titulo">Título del Proyecto *</label>
                    <input type="text" id="titulo" required placeholder="Ej: Rediseño Sitio Web">
                </div>
                
                <div class="form-group">
                    <label for="cliente_nombre">Cliente *</label>
                    <input type="text" id="cliente_nombre" required placeholder="Nombre del cliente asignado">
                </div>
                
                <div class="form-group">
                    <label for="presupuesto">Presupuesto ($ USD)</label>
                    <input type="number" step="0.01" id="presupuesto" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad">
                        <option value="Alta">Alta</option>
                        <option value="Media" selected>Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles clave del proyecto..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary" id="btn-guardar-proj">Guardar</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar-proj" style="display:none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- LISTA Y BÚSQUEDA PROYECTOS -->
        <section class="card">
            <h2>Proyectos Registrados</h2>
            <div class="form-group">
                <input type="text" id="search-proj" placeholder="🔍 Buscar proyecto por título o cliente...">
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Cliente</th>
                            <th>Presupuesto</th>
                            <th>Prioridad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="proyectos-tbody">
                        <tr><td colspan="5">Cargando proyectos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Librería externa de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Scripts locales del proyecto -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
